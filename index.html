<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ROTA • MilhasHub</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

<header>
    <h1>✈️ ROTA • MilhasHub</h1>
    <div id="globalInsight" class="insight"></div>
</header>

<nav class="tabs">
    <button onclick="showTab('saldo')">R • Saldo</button>
    <button onclick="showTab('calc')">O/T • Calculadoras</button>
    <button onclick="showTab('init')">A • Iniciantes</button>
</nav>

<main>

<!-- SALDO -->
<section id="saldo" class="tab active">

<div class="grid">

<div class="card">
<h3>Seus pontos</h3>

<div class="form-grid">
<input type="number" id="azul" placeholder="Azul">
<input type="number" id="latam" placeholder="Latam">
<input type="number" id="smiles" placeholder="Smiles">
<input type="number" id="livelo" placeholder="Livelo">
<input type="number" id="esfera" placeholder="Esfera">
<input type="number" id="c6" placeholder="C6">
</div>

<button onclick="calcularSaldo()">Calcular</button>

<div id="resultadoSaldo" class="result"></div>
<div id="insightSaldo" class="result"></div>
<div id="recomendacaoSaldo" class="result"></div>

</div>

</div>
</section>

<!-- CALCULADORAS -->
<section id="calc" class="tab">

<div class="grid">

<div class="card">
<h3>CPM</h3>

<input type="number" id="valorPago" placeholder="Valor pago (R$)">
<input type="number" id="pontos" placeholder="Pontos recebidos">
<input type="number" id="bonus" placeholder="Bônus (%)">

<button onclick="calcularCPM()">Calcular</button>

<div id="resultadoCPM" class="result"></div>
<div id="vereditoCPM" class="result"></div>
</div>

<div class="card">
<h3>Emissão</h3>

<input type="number" id="milheiros" placeholder="Milheiros">
<input type="number" id="cpmUso" placeholder="CPM">
<input type="number" id="precoDinheiro" placeholder="Preço em dinheiro">

<button onclick="calcularEmissao()">Calcular</button>

<div id="resultadoEmissao" class="result"></div>
<div id="vereditoEmissao" class="result"></div>
</div>

</div>
</section>

<!-- INICIANTES -->
<section id="init" class="tab">

<div class="card">
<h3>Método ROTA</h3>
<ul>
<li><b>R:</b> Acumular pontos</li>
<li><b>O:</b> Transferir com bônus</li>
<li><b>T:</b> Escolher rota inteligente</li>
<li><b>A:</b> Emitir passagem</li>
</ul>
</div>

</section>

</main>

</div>

<script src="script.js"></script>
</body>
</html>
